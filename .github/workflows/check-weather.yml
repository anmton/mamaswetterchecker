name: Check Weather

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  check-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run weather check
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          OPENWEATHER_LAT: ${{ secrets.OPENWEATHER_LAT }}
          OPENWEATHER_LON: ${{ secrets.OPENWEATHER_LON }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          TEMP_THRESHOLD_C: 3
          OPENWEATHER_UNITS: metric
          OPENWEATHER_LANG: de
        run: node scripts/check-weather.mjs
